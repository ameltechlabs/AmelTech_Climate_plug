sentence=ESP32 climate monitoring library with built-in Open-Meteo support, local sensors, hybrid mode, caching, and MQTT/Blynk/REST/Webhook integration.
paragraph=Provides a protected, no-API-key Open-Meteo climate data provider alongside user-configurable custom URLs, TX/RX, a Serial command interface, multi-location management, local sensor support (DHT/BME280/BME680/SHT31), hybrid remote+local data merging, caching with configurable lifetime, and optional MQTT/Blynk/REST/Webhook platform integration. Designed with a non-blocking main loop and a modular, extensible architecture.
